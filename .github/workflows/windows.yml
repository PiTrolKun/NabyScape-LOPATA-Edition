name: LOPATA Edition package check

on:
  workflow_dispatch:
    inputs:
      lopata_ref:
        description: Compatible PiTrolKun/LOPATA commit or tag
        required: true
        type: string

concurrency:
  group: lopata-edition-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out the edition
        uses: actions/checkout@v7.0.1
        with:
          path: edition
          persist-credentials: false
      - name: Check out LOPATA
        uses: actions/checkout@v7.0.1
        with:
          repository: PiTrolKun/LOPATA
          ref: ${{ inputs.lopata_ref }}
          path: lopata
          persist-credentials: false
      - uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Build and verify the island package
        shell: pwsh
        run: ./edition/build.ps1 -LopataRepositoryRoot ./lopata -OutputDirectory "$env:RUNNER_TEMP/lopata-edition"
